spring.application.name=common-lib
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Circuit Breakers
resilience4j.circuitbreaker.instances.accountServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.paymentServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.transactionServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transactionServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.transactionServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.transactionServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transactionServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.customerServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customerServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerServiceCB.waitDurationInOpenState=10s


# Rate Limiters
resilience4j.ratelimiter.instances.customerServiceRL.limitForPeriod=10
resilience4j.ratelimiter.instances.customerServiceRL.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.customerServiceRL.timeoutDuration=0

resilience4j.ratelimiter.instances.accountServiceRL.limitForPeriod=5
resilience4j.ratelimiter.instances.accountServiceRL.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.accountServiceRL.timeoutDuration=0

resilience4j.ratelimiter.instances.paymentServiceRL.limitForPeriod=10
resilience4j.ratelimiter.instances.paymentServiceRL.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.paymentServiceRL.timeoutDuration=0

resilience4j.ratelimiter.instances.transactionServiceRL.limitForPeriod=20
resilience4j.ratelimiter.instances.transactionServiceRL.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.transactionServiceRL.timeoutDuration=0

