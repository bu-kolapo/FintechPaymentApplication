spring.application.name=payment-service
server.port=8087
spring.main.web-application-type=reactive
spring.data.mongodb.uri=mongodb://localhost:27017/payment_db
spring.data.mongodb.database=payment_db
spring.data.mongodb.port=27017
spring.data.mongodb.host=localhost

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
#SWAGGER CONFIG
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
api.info.title=Payment Service API
api.info.version=1.0
api.info.description=Handles Payment Management Endpoints

account.service.url=http://localhost:8085

# Exchange
app.exchange=transaction.exchange

# Queues
app.debit.queue=debit.queue
app.credit.queue=credit.queue
app.response.queue=payment-service-queue

# Routing keys
app.debit.routing=debit.request
app.credit.routing=credit.request