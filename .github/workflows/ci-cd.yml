name: Customer Service CI/CD

on:
  push:
    branches: [ FintechApp ]
  pull_request:
    branches: [ FintechApp ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Install Dependencies
        run: mvn clean install -DskipTests

      - name: Run Unit Tests
        run: |
          cd customer-service
          mvn test -Dtest=CustomerServiceTest

#      - name: Run Integration Tests
#        run: |
#          cd customer-service
#          mvn test -Dtest=CustomerServiceIntegrationTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: customer-service/target/surefire-reports/

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/FintechApp'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/customer-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./customer-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/FintechApp'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

#      - name: Deploy Customer Service
#        run: |
#          IMAGE_TAG=${{ github.sha }}
#          sed -i "s|customer-service:latest|${{ secrets.DOCKER_USERNAME }}/customer-service:$IMAGE_TAG|g" \
#            k8s/fintech-payment-deployment.yaml
#
#          kubectl apply -f k8s/fintech-payment-deployment.yaml
#          kubectl rollout status deployment/customer-service -n customer-service
      - name: Deploy Customer Service
        run: |
          IMAGE_TAG=${{ github.sha }}

          sed -i "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" k8s/fintech-payment-deployment.yaml

          kubectl apply -f k8s/fintech-payment-deployment.yaml --validate=false

          kubectl rollout status deployment/customer-service -n customer-service
