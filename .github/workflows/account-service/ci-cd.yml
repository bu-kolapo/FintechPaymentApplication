name: Account Service CI/CD

on:
  push:
    branches: [ FintechApp ]
    paths:
      - account-service/**
      - common-lib/**
      - pom.xml
  pull_request:
    branches: [ FintechApp ]
    paths:
      - account-service/**
      - common-lib/**
      - pom.xml

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Dependencies
        run: mvn clean install -DskipTests
        shell: powershell

      - name: Run Account Service Tests
        run: |
          cd account-service
          mvn test
        shell: powershell

  build-and-deploy:
    name: Build and Deploy Account Service
    needs: test
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/FintechApp'

    steps:
      - uses: actions/checkout@v4

      - name: Build Project
        run: mvn clean install -DskipTests
        shell: powershell

      - name: Build Docker Image
        run: |
          $IMAGE_TAG = "${{ github.sha }}"
          docker build -t account-service:$IMAGE_TAG ./account-service
          docker tag account-service:$IMAGE_TAG account-service:latest
        shell: powershell

      - name: Deploy to Kubernetes
        run: |
          kubectl config use-context docker-desktop
          kubectl apply -f k8s/account/account-deployment.yaml
          kubectl rollout status deployment/account-service -n account-service
        shell: powershell
