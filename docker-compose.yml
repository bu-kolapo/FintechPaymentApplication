version: '3.8'

services:
  # Redis for caching / sessions
  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for messaging
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Security / Auth service
  auth-service:
    image: auth-service:latest
    build:
      context: ./auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - redis
      - rabbitmq
    networks:
      - microservices-network

  # Customer service
  customer-service:
    image: customer-service:latest
    build:
      context: ./customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - auth-service
      - redis
      - rabbitmq
    networks:
      - microservices-network

  # Account service
  account-service:
    image: account-service:latest
    build:
      context: ./account-service
    ports:
      - "8082:8082"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - customer-service
      - redis
      - rabbitmq
    networks:
      - microservices-network

  # Transaction service
  transaction-service:
    image: transaction-service:latest
    build:
      context: ./transaction-service
    ports:
      - "8083:8083"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - account-service
      - redis
      - rabbitmq
    networks:
      - microservices-network

  # Payment service
  payment-service:
    image: payment-service:latest
    build:
      context: ./payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - transaction-service
      - redis
      - rabbitmq
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
