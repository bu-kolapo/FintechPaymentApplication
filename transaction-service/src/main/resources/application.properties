spring.application.name=transaction-service

server.port=8088
spring.main.web-application-type=reactive
spring.data.mongodb.uri=mongodb://localhost:27017/transaction_db
spring.data.mongodb.database=transaction_db
spring.data.mongodb.port=27017
spring.data.mongodb.host=localhost

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

account.service.base-url=http://localhost:8085

#SWAGGER CONFIG
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
api.info.title=Payment Service API
api.info.version=1.0
api.info.description=Handles Payment Management Endpoints





