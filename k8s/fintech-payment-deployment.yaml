# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: customer-service
---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  namespace: customer-service
data:
  SPRING_REDIS_HOST: redis
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest1
  SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/customerdb
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: customer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
#          image: bukolapo/customer-service:latest this pulls from docker hub,te down puled locally from project
          image: customer-service:latest   # Local Docker image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: customer-service-config
---
# Service (NodePort for local access)
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: customer-service
spec:
  type: NodePort
  selector:
    app: customer-service
  ports:
    - port: 8086
      targetPort: 8086
      nodePort: 30086
