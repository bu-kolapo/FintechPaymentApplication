apiVersion: v1
kind: Namespace
metadata:
  name: customer-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  namespace: customer-service
data:
  # Add your config here
  SPRING_PROFILES_ACTIVE: "local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: customer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:latest  # ✅ Local image name
          imagePullPolicy: Never  # ✅ IMPORTANT: Don't try to pull from registry
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: customer-service-config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: customer-service
spec:
  type: LoadBalancer  # or NodePort for local testing
  selector:
    app: customer-service
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
